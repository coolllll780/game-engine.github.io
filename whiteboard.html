<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenBoard</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#f6f7fb;color:#20283a}header{height:58px;background:white;border-bottom:1px solid #e5e8ef;display:flex;align-items:center;padding:0 16px;gap:12px}b{font-size:18px}.sp{flex:1}button{border:0;border-radius:8px;padding:9px 12px;background:#f0f2f8;cursor:pointer}.share{background:#586af5;color:white}#tools{position:absolute;top:72px;left:12px;background:white;padding:7px;border:1px solid #e5e8ef;border-radius:12px;display:grid;gap:5px;box-shadow:0 5px 25px #0001}.tool{width:40px;height:40px;font-size:17px} .active{background:#e9ecff;color:#4659ed}#bar{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:white;border:1px solid #e5e8ef;border-radius:12px;padding:8px;display:flex;align-items:center;gap:10px}canvas{display:block;width:100vw;height:calc(100vh - 58px);touch-action:none}#status{color:#748096;font-size:12px}
</style></head><body><header><b>✳ OpenBoard</b><span id="room" style="color:#8992a4;font-size:12px"></span><span class="sp"></span><span id="status">Connecting…</span><button class="share" id="share">↗ Share board</button></header><canvas id="c"></canvas><nav id="tools"><button class="tool active" data-t="pen">✎</button><button class="tool" data-t="highlighter">▰</button><button class="tool" data-t="eraser">▱</button><button class="tool" data-t="note">▤</button><button class="tool" data-t="text">T</button><button class="tool" data-t="rect">□</button><button class="tool" data-t="pan">✋</button><button id="clear" class="tool">⌫</button></nav><div id="bar">Colour <input id="color" type="color" value="#26334a"> Size <input id="size" type="range" min="1" max="25" value="4"><span id="zoom">100%</span><button id="reset">Reset view</button></div>
<script>
(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),room=new URLSearchParams(location.search).get('room')||'lobby';document.querySelector('#room').textContent='ROOM / '+room;let items=[],tool='pen',scale=1,ox=0,oy=0,down=false,pan=false,space=false,start,pts=[],cur,s;
const color=document.querySelector('#color'),size=document.querySelector('#size');
function resize(){let d=devicePixelRatio||1;c.width=c.clientWidth*d;c.height=c.clientHeight*d;x.setTransform(d,0,0,d,0,0);draw()}new ResizeObserver(resize).observe(c);
function world(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale}}
function draw(){let w=c.clientWidth,h=c.clientHeight;x.setTransform(devicePixelRatio||1,0,0,devicePixelRatio||1,0,0);x.clearRect(0,0,w,h);x.fillStyle='#f7f8fc';x.fillRect(0,0,w,h);let gap=24*scale,gx=((ox%gap)+gap)%gap,gy=((oy%gap)+gap)%gap;x.fillStyle='#e5e8f0';for(let a=gx;a<w;a+=gap)for(let b=gy;b<h;b+=gap){x.beginPath();x.arc(a,b,.8,0,7);x.fill()}x.save();x.translate(ox,oy);x.scale(scale,scale);[...items,...(cur?[cur]:[])].forEach(it=>{x.save();if(it.type==='stroke'){x.globalCompositeOperation=it.tool==='eraser'?'destination-out':'source-over';x.globalAlpha=it.tool==='highlighter'?.23:1;x.strokeStyle=it.color;x.fillStyle=it.color;x.lineWidth=it.width*(it.tool==='highlighter'?3:1);x.lineCap='round';x.lineJoin='round';x.beginPath();(it.points||[]).forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke()}if(it.type==='note'){x.fillStyle='#fff1a6';x.fillRect(it.x,it.y,180,110);x.fillStyle='#51451b';x.font='15px system-ui';x.fillText(it.text,it.x+12,it.y+25,155)}if(it.type==='text'){x.fillStyle=it.color;x.font='22px system-ui';x.fillText(it.text,it.x,it.y)}if(it.type==='shape'){x.strokeStyle=it.color;x.lineWidth=it.width;x.strokeRect(it.x,it.y,it.w,it.h)}x.restore()});x.restore();document.querySelector('#zoom').textContent=Math.round(scale*100)+'%'}
function send(a){if(s?.readyState===1)s.send(JSON.stringify(a))}function add(a){items.push(a);draw()}
function connect(){s=new WebSocket('wss://openboard.joel-robinson.workers.dev/ws/'+room);s.onopen=()=>document.querySelector('#status').textContent='● Live';s.onclose=()=>{document.querySelector('#status').textContent='Reconnecting…';setTimeout(connect,1500)};s.onmessage=e=>{let a=JSON.parse(e.data);if(a.type==='init')items=a.items||[];else if(a.type==='clear')items=[];else items.push(a);draw()}}connect();
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;document.querySelectorAll('[data-t]').forEach(z=>z.classList.toggle('active',z===b))});
c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);let p=world(e);if(tool==='pan'||space){pan=true;start={x:e.clientX,y:e.clientY,ox,oy};return}if(tool==='note'||tool==='text'){let text=prompt(tool==='note'?'Sticky note:':'Text:');if(text){let a={type:tool,x:p.x,y:p.y,text,color:color.value};add(a);send(a)}return}down=true;pts=[p];cur=tool==='rect'?{type:'shape',x:p.x,y:p.y,w:0,h:0,color:color.value,width:+size.value}:{type:'stroke',tool,color:color.value,width:+size.value,points:pts};draw()};
c.onpointermove=e=>{if(pan){ox=start.ox+e.clientX-start.x;oy=start.oy+e.clientY-start.y;draw();return}if(!down)return;let p=world(e);if(tool==='rect'){cur.w=p.x-pts[0].x;cur.h=p.y-pts[0].y}else{pts.push(p);cur.points=pts}draw()};
function end(){if(pan)pan=false;if(down){down=false;if(cur){if(cur.type!=='shape'||(Math.abs(cur.w)>2&&Math.abs(cur.h)>2)){if(cur.type==='shape'){if(cur.w<0){cur.x+=cur.w;cur.w=-cur.w}if(cur.h<0){cur.y+=cur.h;cur.h=-cur.h}}add(cur);send(cur)}}cur=null;pts=[];draw()}}c.onpointerup=end;c.onpointercancel=end;
c.onwheel=e=>{e.preventDefault();let r=c.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,old=scale;scale=Math.max(.2,Math.min(4,scale*(e.deltaY<0?1.1:.9)));ox=mx-(mx-ox)*scale/old;oy=my-(my-oy)*scale/old;draw()};
document.onkeydown=e=>{if(e.code==='Space'){space=true;e.preventDefault()}};document.onkeyup=e=>{if(e.code==='Space')space=false};
document.querySelector('#share').onclick=()=>navigator.clipboard.writeText(location.origin+location.pathname+'?room='+room).then(()=>alert('Link copied! Anyone with this link can edit.'));
document.querySelector('#clear').onclick=()=>{if(confirm('Clear this board for everyone?')){items=[];draw();send({type:'clear'})}};
document.querySelector('#reset').onclick=()=>{scale=1;ox=oy=0;draw()};
})();
</script></body></html>
